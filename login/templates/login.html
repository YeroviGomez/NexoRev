{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo ReV | Iniciar sesión</title>
  <link rel="stylesheet" href="{% static 'login/arte.css' %}">
</head>
<body>
  <main class="auth-layout">
    <aside class="brand-panel" aria-label="Nexo ReV">
      <div class="brand-title">
        <svg class="brand-mark" width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 29h9.4l5.3-20 9.1 37 6.2-23h14" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Nexo ReV</h1>
      </div>
      <p class="lead">Rehabilitación desde tu hogar</p>
    </aside>

    <section class="form-panel">
      <nav class="tab-switch" role="tablist">
        <a href="/login/" class="tab active">Iniciar Sesión</a>
        <a href="/registro/" class="tab">Registrarse</a>
      </nav>

      <form id="loginForm" method="post" action="{% url 'login' %}" novalidate>
        {% csrf_token %}
        {% if error_message %}
          <p class="form-message error">{{ error_message }}</p>
        {% endif %}

        <div class="form-head">
          <h2>Bienvenido</h2>
          <p>Ingresa tus credenciales para continuar</p>
        </div>

        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="tu@ejemplo.com"
            required
          >
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="primary-btn">Iniciar Sesión</button>

        <a href="#" class="text-link">¿Olvidaste tu contraseña?</a>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");

    // Validación ligera en cliente. El chequeo definitivo es en backend.
    const allowedDomains = new Set([
      'gmail.com','hotmail.com','outlook.com','live.com','yahoo.com','icloud.com','protonmail.com','zoho.com','aol.com','gmx.com','yandex.com','mail.com','fastmail.com','tutanota.com'
    ]);

    function validEmailDomain(email) {
      if (!email || !email.includes('@')) return false;
      if (!email.toLowerCase().endsWith('.com')) return false;
      const domain = email.split('@').pop().toLowerCase();
      return allowedDomains.has(domain);
    }

    form.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;

      const fields = Array.from(form.querySelectorAll("input"));
      const currentIndex = fields.indexOf(event.target);

      if (currentIndex >= 0 && currentIndex < fields.length - 1) {
        event.preventDefault();
        fields[currentIndex + 1].focus();
      }
    });

    form.addEventListener('submit', (e) => {
      const emailVal = emailInput.value.trim();
      if (!validEmailDomain(emailVal)) {
        e.preventDefault();
        alert('Ingrese un correo válido.');
        emailInput.focus();
      }
    });
  </script>
</body>
</html>
