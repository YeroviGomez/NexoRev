<style>
  .scroll-top-button {
    position: fixed;
    right: 1.5rem;
    bottom: 1.5rem;
    z-index: 9999;
    display: grid;
    width: 3.25rem;
    height: 3.25rem;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #009688;
    color: #ffffff;
    box-shadow: 0 0.5rem 1.5rem rgba(7, 17, 36, 0.24);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(0.5rem);
    transition: opacity 180ms ease, transform 180ms ease, background-color 180ms ease, visibility 180ms ease;
    visibility: hidden;
  }

  .scroll-top-button.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
    visibility: visible;
  }

  .scroll-top-button:hover { background: #007f77; }
  .scroll-top-button:focus-visible { outline: 3px solid #071124; outline-offset: 3px; }
  .scroll-top-button svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 560px) {
    .scroll-top-button { right: 1rem; bottom: 1rem; }
  }
</style>

<button class="scroll-top-button" type="button" aria-label="Volver arriba" aria-hidden="true" tabindex="-1">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M12 19V5M5 12l7-7 7 7" />
  </svg>
</button>

<script>
  const scrollTopButton = document.currentScript.previousElementSibling;
  const updateScrollTopButton = () => {
    const scrollPosition = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop;
    const isVisible = scrollPosition > 300;
    scrollTopButton.classList.toggle('is-visible', isVisible);
    scrollTopButton.setAttribute('aria-hidden', String(!isVisible));
    scrollTopButton.tabIndex = isVisible ? 0 : -1;
  };

  window.addEventListener('scroll', updateScrollTopButton, { passive: true });
  updateScrollTopButton();

  scrollTopButton.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: document.documentElement.dataset.motion === 'off' ? 'auto' : 'smooth',
    });
  });
</script>
