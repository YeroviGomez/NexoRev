<section class="app-view" id="favoritosView" data-view="favoritos">
  <header class="page-head compact">
    <h1>Mis videos favoritos</h1>
    <p>Accede rápidamente a las rutinas que guardaste.</p>
  </header>

  <div class="favorites-toolbar">
    <span class="favorites-count" id="favoritesCount">0 videos guardados</span>
    <button class="outline-button" id="clearFavorites" type="button">Quitar todos</button>
  </div>

  <section class="favorites-grid" id="favoritesGrid" aria-label="Videos favoritos"></section>
  <p class="favorites-empty" id="favoritesEmpty">Todavía no tienes videos favoritos. Guarda uno desde la sección Videos.</p>
</section>
